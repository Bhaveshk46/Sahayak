<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bank Customer KYC & Account Verification</title>
</head>
<body>
  <div class="kyc-portal">
    <h2>Statutory KYC & Re-KYC Update Form</h2>
    <form id="bank-kyc-form">
      <div class="section-title">Identity Credentials</div>

      <!-- Applicant Name -->
      <div class="form-row">
        <label for="acc_holder_name">Account Holder Legal Name (as on PAN) *</label>
        <input type="text" id="acc_holder_name" name="account_holder_name" required placeholder="Full name" />
      </div>

      <!-- PAN -->
      <div class="form-row">
        <label for="kyc_pan">Permanent Account Number (PAN Card) *</label>
        <input type="text" id="kyc_pan" name="pan_number" maxlength="10" placeholder="ABCDE1234F" required />
      </div>

      <!-- Aadhaar -->
      <div class="form-row">
        <label for="kyc_aadhaar">12-Digit Aadhaar (UID) Number *</label>
        <input type="text" id="kyc_aadhaar" name="aadhaar_no" maxlength="12" placeholder="123456789012" required />
      </div>

      <!-- DOB -->
      <div class="form-row">
        <label for="kyc_dob">Date of Birth (as per Aadhaar) *</label>
        <input type="date" id="kyc_dob" name="birth_date" required />
      </div>

      <!-- Mobile Linked with Aadhaar -->
      <div class="form-row">
        <label for="kyc_mobile">Mobile Number (Aadhaar Registered) *</label>
        <input type="tel" id="kyc_mobile" name="mobile_number" placeholder="9876543210" required />
      </div>

      <!-- Email -->
      <div class="form-row">
        <label for="kyc_email">Registered Email ID *</label>
        <input type="email" id="kyc_email" name="email_id" required />
      </div>

      <!-- Gross Annual Income -->
      <div class="form-row">
        <label for="annual_gross_income">Annual Family / Household Gross Income (INR) *</label>
        <input type="number" id="annual_gross_income" name="annual_income_inr" placeholder="500000" min="0" required />
      </div>

      <!-- Permanent Address -->
      <div class="form-row">
        <label for="permanent_residence">Permanent Residential Address (with Landmark) *</label>
        <textarea id="permanent_residence" name="residential_address" rows="3" required placeholder="Flat/House No, Street, Locality"></textarea>
      </div>

      <!-- PIN Code -->
      <div class="form-row">
        <label for="postal_pincode">6-Digit Postal PIN Code *</label>
        <input type="text" id="postal_pincode" name="pincode" maxlength="6" placeholder="411001" required />
      </div>

      <!-- Mandatory Document Uploads -->
      <div class="section-title">Mandatory Document Attachments</div>

      <!-- Identity Document: PAN -->
      <div class="form-row dropzone-container" data-formpilot-dropzone-wrapper="true">
        <label for="pan_doc_file">PAN Card Document Copy *</label>
        <span class="hint">Max size 200 KB, PDF or JPG</span>
        <div class="drop-zone" data-formpilot-dropzone="true">
          <input type="file" id="pan_doc_file" name="pan_document" accept=".pdf,.jpg,.jpeg" required />
        </div>
      </div>

      <!-- Address Proof: Aadhaar or Passport -->
      <div class="form-row dropzone-container" data-formpilot-dropzone-wrapper="true">
        <label for="aadhaar_doc_file">Proof of Address Document (Aadhaar / Passport) *</label>
        <span class="hint">Max size 500 KB, PDF only</span>
        <div class="drop-zone" data-formpilot-dropzone="true">
          <input type="file" id="aadhaar_doc_file" name="address_document" accept=".pdf" required />
        </div>
      </div>

      <button type="submit">Complete KYC Verification</button>
    </form>
  </div>
</body>
</html>
